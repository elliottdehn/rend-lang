[workspace]
resolver = "2"
members = [
    "crates/rend",
    "crates/rend-rocksdb",
    "crates/rend-server",
    "crates/rend-bench",
]

[workspace.package]
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
rend = { path = "crates/rend" }
rend-rocksdb = { path = "crates/rend-rocksdb" }
rend-server = { path = "crates/rend-server" }

# Server stack
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "1"
anyhow = "1"

# Storage
rocksdb = { version = "0.22", default-features = false, features = ["snappy"] }

# Crypto — EOA-style auth
secp256k1 = { version = "0.29", features = ["recovery", "rand"] }
tiny-keccak = { version = "2", features = ["keccak"] }
rand = "0.8"

# Arbitrary-precision integers for the `json` runtime type
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
num-traits = { version = "0.2", default-features = false }
