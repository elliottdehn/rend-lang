[workspace]
resolver = "2"
members = [
    "crates/rend",
    "crates/rend-rocksdb",
    "crates/rend-server",
]

[workspace.package]
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
rend = { path = "crates/rend" }
rend-rocksdb = { path = "crates/rend-rocksdb" }

# Server stack
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "1"
anyhow = "1"

# Storage
rocksdb = { version = "0.22", default-features = false, features = ["snappy"] }
